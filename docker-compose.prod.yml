# ==============================================================
# TMail Web — Production Docker Compose
# Target: app.sidoak.my.id (DigitalOcean Ubuntu 24.04)
# ==============================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
# ==============================================================

services:
  tmail-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: tmail-web
    restart: unless-stopped

    # ── Ports ─────────────────────────────────────────────────
    # Only expose to localhost — Nginx handles external traffic
    ports:
      - "127.0.0.1:3000:3000"

    # ── Environment ───────────────────────────────────────────
    environment:
      NODE_ENV: production
      APP_VERSION: "1.0.0"
      # DB_HOST points to host machine where PostgreSQL runs
      DB_HOST: "host.docker.internal"
      DB_PORT: "5432"
      JWT_SECRET: "${JWT_SECRET}"
      NEXTAUTH_URL: "https://app.sidoak.my.id"

    # ── db.env from existing VPS infrastructure ───────────────
    # Mounts /opt/sidoak/infra/db.env read-only into container
    volumes:
      - type: bind
        source: /opt/sidoak/infra/db.env
        target: /run/secrets/db.env
        read_only: true

    # ── Extra hosts (for Docker → host PostgreSQL) ────────────
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ── Health check ─────────────────────────────────────────
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

    # ── Logging ───────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ── Resource limits (2GB VPS) ─────────────────────────────
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

# ── No internal network needed ────────────────────────────────
# App connects to host PostgreSQL via host.docker.internal
# Nginx runs on host, not in Docker
